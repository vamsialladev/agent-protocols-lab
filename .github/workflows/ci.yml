name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Lint, tests, demo smoke runs, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (the AP2 SDK without its exact pins; see requirements-nodeps.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -r requirements-nodeps.txt
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (coverage gate 80%; no API key, no Node; demo 2's live test is opt-in)
        run: python -m pytest --cov=demos --cov=protolab --cov-report=term-missing --cov-fail-under=80
      - name: Every demo that runs without Node or a key, end to end
        env:
          PYTHONPATH: src
        run: |
          for d in mcp_server a2a acp anp agora a2ui ap2 ucp x402; do
            echo "== $d"; python -m demos.$d.demo
          done
      # PYSEC-2026-1325 (CVE-2024-23342): python-ecdsa's Minerva timing attack on P-256 signing, no fix planned
      # upstream. ecdsa comes in through anp; nothing here signs with it (ANP uses Ed25519, AP2 ES256, both via
      # cryptography). docs/DECISIONS.md, decision 9.
      - name: Dependency audit (packages installed from GitHub archives can't be audited and are listed)
        run: pip-audit --skip-editable --progress-spinner off --ignore-vuln PYSEC-2026-1325
      - name: Red-team gate (every attack in docs/RED_TEAM.md must be refused)
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_a2a.py::test_a_wrong_token_is_refused
          tests/test_a2a.py::test_a_bad_request_fails_the_task_cleanly
          tests/test_acp.py::test_a_wrong_token_is_refused
          tests/test_anp.py::test_a_header_made_for_another_domain_is_refused
          tests/test_anp.py::test_unknown_did_and_a_forged_document_are_refused
          tests/test_anp.py::test_a_stale_message_is_refused
          tests/test_ap2.py::test_limits_and_replay_in_one_session
          tests/test_ap2.py::test_a_cart_changed_after_signing_is_refused
          tests/test_ap2.py::test_a_merchant_outside_the_intent_is_refused
          tests/test_ap2.py::test_an_expired_cart_is_refused
          tests/test_ap2.py::test_a_signature_from_another_key_or_for_another_payment_is_refused
          tests/test_x402.py::test_402_then_pay_then_data_and_a_replay_is_refused
          tests/test_x402.py::test_a_forged_or_mismatched_voucher_does_not_settle
          tests/test_a2ui.py::test_components_and_events_outside_the_allowlist_are_refused
          tests/test_a2ui.py::test_the_official_validator_rejects_a_malformed_allowed_component
          tests/test_a2ui.py::test_tree_problems_and_protocol_problems_are_refused
          tests/test_mcp_consumer.py::test_only_allowlisted_tools_are_exposed
          tests/test_mcp_consumer.py::test_refused_calls_never_reach_the_server_and_are_audited
          tests/test_mcp_server.py::test_each_role_sees_only_its_tools_and_gets_policy_passages
          tests/test_ucp.py::test_every_exchange_conforms_to_the_official_sdk_models
          tests/test_ucp.py::test_the_sdk_check_catches_the_spec_only_shapes
      - name: SBOM (CycloneDX)
        run: cyclonedx-py environment --output-format JSON --output-file sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json

  links:
    name: Link check (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 3 --accept "200..=299,303,403,429,503,999"
            --exclude "^https://(www\.)?linkedin\.com" --exclude "^https?://(localhost|127\.0\.0\.1)"
            --exclude "^https?://[a-z.-]+\.test" --exclude "^https://a2ui\.org/specification"
            --exclude "^https://github\.com/vamsialladev/agent-protocols-lab/actions"
            --exclude "^https://github\.com/(wildcard-xyz/agents\.json|near/aitp)"
            README.md SECURITY.md CONTRIBUTING.md CHANGELOG.md CODE_OF_CONDUCT.md 'docs/**/*.md' 'demos/**/README.md'
          fail: true

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
