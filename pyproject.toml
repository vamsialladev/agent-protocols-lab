[project]
name = "agent-protocols-lab"
version = "0.1.0"
description = "One small, tested demo per agent protocol (MCP, A2A, ACP, ANP, Agora, AG-UI, A2UI, AP2, UCP, x402), in a simulated hotel."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Vamsi Alla" }]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "S603", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # test tokens are not secrets

[tool.ruff.lint.isort]
known-first-party = ["protolab", "demos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]
